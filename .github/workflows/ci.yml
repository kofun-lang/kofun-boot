name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Report the pinned language revision
        run: git -C vendor/kofun log -1 --format='vendor/kofun is at %h %s'
      - name: Every module core
        run: sh scripts/test-modules.sh
      - name: A recorded session replays
        run: sh scripts/trace.sh replay contracts/session.trace

  architecture:
    name: Modules — owned verticals and contract-only dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: sh tests/architecture/check.sh

  gate:
    name: Boot gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # The gate type-checks the generated client when tsc is present and says
      # SKIP when it is not. Installing it here means CI never takes the skip:
      # a gate that quietly degrades on the machine that matters is a gate
      # that is not running.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install -g typescript@5.9.3
      - run: sh tests/boot/check.sh

  schema:
    name: Schema — the history replays to the declaration, and SQL is a projection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: sh tests/schema/check.sh

  loader:
    name: Loader — statements do not grow with N, and N+1 is refused by name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: sh tests/loader/check.sh

  schema-postgres:
    name: Schema — both SQL projections build the same PostgreSQL database
    runs-on: ubuntu-latest
    env:
      # The check reports SKIP on a machine without PostgreSQL. Here that
      # would be a gate that is not running, so it is a failure instead.
      SCHEMA_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Ensure PostgreSQL server binaries
        run: |
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql
          fi
      - run: sh tests/schema/postgres.sh

  research-pack:
    name: Deterministic research ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh tests/research/check.sh

  serve:
    name: Integration — a real server on a real socket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: sh tests/integration/serve.sh

  scaffold:
    name: Scaffold — boot new emits a project that passes its own gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: sh tests/scaffold/check.sh

  release:
    name: Release coherence — the declared unmeasured set matches the README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The gate refuses to re-use an existing tag, so it needs the tags.
          fetch-depth: 0
      - run: sh tests/release/check.sh
