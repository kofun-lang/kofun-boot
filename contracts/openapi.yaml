openapi: 3.1.0
info:
  title: kofun-boot seed
  version: 0.1.0
paths:
  /hello:
    get:
      operationId: handler1
      responses:
        "200": { description: ok }
        "404": { description: no route matched }
        "405": { description: method not allowed }
        "413": { description: body over the limit }
  /sum:
    post:
      operationId: handler2
      security:
        - bearer: []
      x-kofun-requires: member
      responses:
        "200": { description: ok }
        "401": { description: no authenticated caller }
        "403": { description: "the caller holds a role below member" }
        "404": { description: no route matched }
        "405": { description: method not allowed }
        "413": { description: body over the limit }
  /bench:
    get:
      operationId: handler3
      responses:
        "200": { description: ok }
        "404": { description: no route matched }
        "405": { description: method not allowed }
        "413": { description: body over the limit }
    post:
      operationId: handler4
      responses:
        "200": { description: ok }
        "404": { description: no route matched }
        "405": { description: method not allowed }
        "413": { description: body over the limit }
  /things/{id}:
    get:
      operationId: handler5
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      security:
        - bearer: []
      x-kofun-requires: admin
      responses:
        "200": { description: ok }
        "401": { description: no authenticated caller }
        "403": { description: "the caller holds a role below admin" }
        "404": { description: no route matched }
        "405": { description: method not allowed }
        "413": { description: body over the limit }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
